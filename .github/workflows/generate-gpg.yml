name: One-Click GPG Key Generator

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: 'Passphrase for the GPG Key (leave empty for auto-generated)'
        required: false
        default: 'DevCloudDesk@2026!'

jobs:
  generate:
    name: Generate & Upload GPG Key
    runs-on: ubuntu-latest
    steps:
      - name: Generate GPG Key Pair on Ubuntu
        id: gpg
        run: |
          PASSPHRASE="${{ inputs.passphrase }}"
          
          # Generate 3072-bit RSA signing key non-interactively
          cat <<EOF > gpg_gen.conf
          %echo Generating DevCloudDesk GPG Key...
          Key-Type: RSA
          Key-Length: 3072
          Subkey-Type: RSA
          Subkey-Length: 3072
          Name-Real: DevCloudDesk
          Name-Email: support@devclouddesk.com
          Expire-Date: 0
          Passphrase: ${PASSPHRASE}
          %commit
          %echo Done!
          EOF

          gpg --batch --generate-key gpg_gen.conf

          # Get Key ID
          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep 'sec   rsa3072/' | awk '{print $2}' | cut -d'/' -f2)
          echo "Key ID generated: $KEY_ID"

          # Upload public key to public keyservers
          echo "Uploading public key to keyserver.ubuntu.com..."
          gpg --keyserver keyserver.ubuntu.com --send-keys "$KEY_ID" || true
          gpg --keyserver keys.openpgp.org --send-keys "$KEY_ID" || true

          # Export private key in ASCII-armored format
          PRIVATE_KEY=$(gpg --armor --export-secret-keys "$KEY_ID")

          # Write to Step Summary for 1-click copy-paste
          echo "## 🔐 Your Maven Central GPG Keys Are Ready!" >> $GITHUB_STEP_SUMMARY
          echo "Public Key ID: \`$KEY_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 1. Secret Name: \`MAVEN_GPG_PASSPHRASE\`" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$PASSPHRASE" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 2. Secret Name: \`MAVEN_GPG_PRIVATE_KEY\`" >> $GITHUB_STEP_SUMMARY
          echo "Copy the block below and paste into GitHub Secret \`MAVEN_GPG_PRIVATE_KEY\`:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "$PRIVATE_KEY" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
